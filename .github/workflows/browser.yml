name: Browser lane

# ⚠ `pnpm test:browser` is the only lane that sees real theme CSS and the live widget, and it has
# found every live defect so far (#36, SahajAtlasWeb#235, SahajAtlasWeb#236). It needs the network,
# so it cannot be a required check. It runs on a pull request only when the PR touches a file that
# shapes the embed, and on demand. Nothing in this repo runs on a schedule.
#
# ⚠ Never a required check. A path-filtered workflow that a ruleset requires never reports on a PR
# outside its paths, and the merge waits forever. A red run is a FAIL verdict, which is this
# plugin's. A WIDGET verdict is SahajAtlasWeb's, and shows in the summary without failing the run.
#
# ⚠ The lane is 23 cells, each booting a WordPress and a Chromium page, one after another. Run as one
# job it outlasted a 60-minute budget and was cancelled with no log (run 44154134735). So it runs as
# a matrix of shards (`--shard k/n`), each with a step timeout inside a job timeout. The summary step
# runs `always()`, so a shard that times out still says which cell it stopped on.
on:
  pull_request:
    paths:
      - 'sahaj-atlas.php'
      - 'includes/**'
      - 'templates/**'
      - 'assets/**'
      - 'blocks/**'
      - 'modules/**'
      - 'tests/browser.mjs'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-lane
  cancel-in-progress: false

jobs:
  # A skip has to be visible. A missing secret would otherwise either fail the run, which blames the
  # plugin for a configuration gap, or pass it, which reads as coverage nobody has. One gate job
  # decides, so a skip is one warning rather than one per shard. ⚠ It carries whether the secret is
  # set, never the secret: only the lane step gets the key.
  gate:
    name: Is the test key set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    env:
      HAS_TEST_KEY: ${{ secrets.SAHAJ_ATLAS_TEST_KEY != '' }}
    steps:
      - id: key
        run: |
          echo "has_key=$HAS_TEST_KEY" >>"$GITHUB_OUTPUT"
          if [ "$HAS_TEST_KEY" != 'true' ]; then
            echo "::warning title=Browser lane skipped::The SAHAJ_ATLAS_TEST_KEY repository secret is not set, so nothing ran. Add the Sahaj Atlas (Local Test Key) client's key from a SahajCloud admin."
            {
              echo "### Browser lane skipped"
              echo
              echo "The \`SAHAJ_ATLAS_TEST_KEY\` repository secret is not set, so this run tested nothing."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  browser:
    name: Browser lane, shard ${{ matrix.shard }}/2
    needs: gate
    if: needs.gate.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    # The backstop. The lane step has its own, shorter timeout so the summary still runs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright-core install --with-deps chromium

      - name: Run the browser lane
        timeout-minutes: 15
        env:
          SAHAJ_ATLAS_TEST_KEY: ${{ secrets.SAHAJ_ATLAS_TEST_KEY }}
        run: |
          set -o pipefail
          pnpm test:browser --shard ${{ matrix.shard }}/2 2>&1 | tee browser-output.txt

      # `always()`, not `success()`: a failed or timed-out lane is exactly when the verdicts matter.
      - name: Summarise the verdicts
        if: always()
        run: |
          {
            echo "### Browser lane, shard ${{ matrix.shard }}/2"
            echo
            echo '```'
            if [ -f browser-output.txt ]; then
              grep -E '^\s*(FAIL|WIDGET|KNOWN)\b|^[0-9]+ failure' browser-output.txt || echo "No FAIL, WIDGET or KNOWN verdicts."
              echo
              grep -E '^\s+time\s' browser-output.txt || true
              echo "Last cell started: $(grep -E '^[a-z0-9-]+( |$)' browser-output.txt | grep -v '^Shard' | tail -1)"
              grep -q '^[0-9]* failure' browser-output.txt || echo "The lane did not finish: no final tally."
            else
              echo "The lane produced no output."
            fi
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
