name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the required checks against a merge_group ref, not
  # the PR head. Without this trigger the check never reports and the queue
  # stalls forever. (why: sydevs/claude-workflow docs/why.md#github-owns-the-merge)
  merge_group:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── Docs-only changes take the light lane ───────────────────────────────
      # A change touching nothing but markdown, docs/, .claude/ or .vscode/ breaks
      # nothing below: `pnpm lint` parses only .php files, no test reads a doc, and
      # `.distignore` keeps every one of them out of the zip. So the steps that
      # follow are skipped and the job reports success in seconds. `readme.txt`
      # is not `.md`: it is plugin metadata that ships, so it stays on the full lane.
      #
      # ⚠ Gate steps, never the workflow. `Lint & test` is a required check, and a
      # workflow-level `paths-ignore` would leave it never reporting, so the merge
      # would wait forever. A skipped step passes; a skipped workflow does not.
      # (why: sydevs/claude-workflow docs/why.md#a-docs-only-change-takes-the-light-lane)
      - name: Classify the change
        id: scope
        uses: sydevs/claude-workflow/.github/actions/change-scope@main

      # release.yml runs the same script after the merge. Here a missed version declaration or a
      # broken zip fails the PR, before a release goes red on main.
      - name: Package the plugin zip
        if: ${{ steps.scope.outputs.full == 'true' }}
        id: package
        run: .github/scripts/package.sh . build

      - name: Say what merging releases
        if: ${{ steps.scope.outputs.full == 'true' && (steps.package.outputs.pending == 'true') }}
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: echo "::notice title=Release::Merging to main releases v$VERSION to every site running the plugin."

      - if: ${{ steps.scope.outputs.full == 'true' }}
        uses: pnpm/action-setup@v6

      - if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm install --frozen-lockfile

      # The PHP steps run in WebAssembly through @wp-playground/cli. This needs no system PHP or
      # Docker. ⚠ Every invocation names PHP 7.4, the fleet's floor. The CLI's own default is 8.3,
      # where a syntax check accepts `?->` and every other PHP 8 construct a client site cannot
      # parse. The blueprint lanes pin it through `preferredVersions`; this one passes `--php 7.4`.
      - name: Syntax check
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm lint

      # Plain node, not WebAssembly: this is the one shipped script, and no PHP lane executes it.
      - name: Measurement checks (assets/atlas-page.js)
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm test:measure

      - name: Integration tests (WordPress 6.7, PHP 7.4)
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm test

      # This step starts a real server for each theme kind. The plugin uses a different code path
      # for each kind: `register_block_template()` for block themes, `template_include` for classic
      # themes. A pass on one kind does not test the other.
      - name: Render checks (block and classic themes)
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm test:render

      # ⚠ Every step above mounts the working tree. This one boots the zip sites install, so a file
      # `.distignore` wrongly leaves out fails the PR, not every site's next automatic update.
      - name: Boot the built zip
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm test:zip "${{ steps.package.outputs.zip }}"

  # PHP 7.4 is the declared floor and has been end-of-life since 2022, so the job above is the
  # only one that proves the floor and none proves what most sites now run. This one runs the same
  # suites on a current PHP and WordPress. It reports only the lanes that boot WordPress; lint and
  # the measurement script do not depend on the version. See tests/versions.mjs.
  #
  # ⚠ WordPress is `latest`, so a core release shows up on the next pull request instead of on a
  # site. That can turn an unrelated PR red on a release day, which is the point: it is the only
  # lane that sees a new core. It is not a required check. PHP stays pinned, and raising it is a
  # deliberate commit. Nothing in this repo runs on a schedule.
  current:
    name: Tests (current PHP and WordPress)
    runs-on: ubuntu-latest
    env:
      SAHAJ_ATLAS_PHP: '8.3'
      SAHAJ_ATLAS_WP: latest
    steps:
      - uses: actions/checkout@v7

      # Light lane, as in `Lint & test` above: a docs-only change skips the steps below.
      - name: Classify the change
        id: scope
        uses: sydevs/claude-workflow/.github/actions/change-scope@main

      - if: ${{ steps.scope.outputs.full == 'true' }}
        uses: pnpm/action-setup@v6

      - if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm test

      - name: Render checks (block and classic themes)
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: pnpm test:render

  contract:
    name: URL contract in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `atlas-url-contract.json` must stay byte-identical across three repos: SahajCloud (builds
      # these URLs), SahajAtlasWeb (parses them), and here (serves them). A PR that changes this
      # copy must leave it exactly as SahajCloud's file. A PR that leaves it alone passes, however
      # far SahajCloud has moved: the contract sync opens the re-sync PR, and comparing every PR
      # with SahajCloud main reddened every open PR on each upstream change.
      #
      # ⚠ A green run often means "this PR did not touch the copy", not "the copies match". The
      # step log says which. It reads the public raw URL with no token, so if SahajCloud goes
      # private the comparison fails loudly rather than skipping (the old `gh api` version warned
      # and passed for months on a missing secret).
      # why: sydevs/claude-workflow/docs/why.md#a-contract-check-checks-what-a-pr-changes
      - name: Compare a changed copy with SahajCloud
        uses: sydevs/claude-workflow/.github/actions/contract-check@main

  # Dependency-vulnerability gate. Fails only when this PR ADDS a dependency
  # with a high or critical advisory that reaches production code. An
  # advisory against a dependency already on main fails nothing here: the
  # sydevs loop's daily Dependabot check fixes those, so an unrelated PR is
  # never blocked by something it did not cause. Shared by the sydevs repos;
  # the rules live in
  # sydevs/claude-workflow/.github/workflows/dependency-review.yml.
  dependencies:
    name: Dependency Review
    uses: sydevs/claude-workflow/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
