name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the required checks against a merge_group ref, not
  # the PR head. Without this trigger the check never reports and the queue
  # stalls forever. (why: sydevs/claude-workflow docs/why.md#github-owns-the-merge)
  merge_group:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # release.yml runs the same script after the merge. Here a missed version declaration or a
      # broken zip fails the PR, before a release goes red on main.
      - name: Package the plugin zip
        id: package
        run: .github/scripts/package.sh . build

      - name: Say what merging releases
        if: steps.package.outputs.pending == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: echo "::notice title=Release::Merging to main releases v$VERSION to every site running the plugin."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The PHP steps run in WebAssembly through @wp-playground/cli. This needs no system PHP or
      # Docker. ⚠ Every invocation names PHP 7.4, the fleet's floor. The CLI's own default is 8.3,
      # where a syntax check accepts `?->` and every other PHP 8 construct a client site cannot
      # parse. The blueprint lanes pin it through `preferredVersions`; this one passes `--php 7.4`.
      - name: Syntax check
        run: pnpm lint

      # Plain node, not WebAssembly: this is the one shipped script, and no PHP lane executes it.
      - name: Measurement checks (assets/atlas-page.js)
        run: pnpm test:measure

      - name: Integration tests (WordPress 6.7, PHP 7.4)
        run: pnpm test

      # This step starts a real server for each theme kind. The plugin uses a different code path
      # for each kind: `register_block_template()` for block themes, `template_include` for classic
      # themes. A pass on one kind does not test the other.
      - name: Render checks (block and classic themes)
        run: pnpm test:render

  # PHP 7.4 is the declared floor and has been end-of-life since 2022, so the job above is the
  # only one that proves the floor and none proves what most sites now run. This one runs the same
  # suites on a current PHP and WordPress. It reports only the lanes that boot WordPress; lint and
  # the measurement script do not depend on the version. See tests/versions.mjs.
  #
  # ⚠ Both versions are pinned, and raising one is a deliberate commit. A floating `latest` turns a
  # pull request that changed nothing red on a core release day — the policy the `dependencies` job
  # below writes down. browser.yml and upstream.yml are where an upstream release is allowed to go
  # red, because neither blocks anyone.
  current:
    name: Tests (current PHP and WordPress)
    runs-on: ubuntu-latest
    env:
      SAHAJ_ATLAS_PHP: '8.3'
      SAHAJ_ATLAS_WP: '7.1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test

      - name: Render checks (block and classic themes)
        run: pnpm test:render

  # Security and PHP-compatibility sniffs, not the full WordPress standard. Composer runs here
  # only: .github is in .distignore, so none of it reaches the zip, and the plugin keeps its
  # no-build-step rule. The ruleset says why it is narrow.
  phpcs:
    name: PHPCS (security and compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠ `install`, never `update`: `.github/phpcs/composer.lock` is committed so every run sniffs
      # with the same rules. `WordPress.Security` is a category reference, so a WPCS minor that adds
      # a sniff would otherwise fail a PR that changed nothing.
      - name: Install PHP_CodeSniffer and the rulesets
        run: composer install --working-dir=.github/phpcs --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: .github/phpcs/vendor/bin/phpcs --standard=.github/phpcs/phpcs.xml .

  contract:
    name: URL contract in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `atlas-url-contract.json` must stay byte-identical across three repos: SahajCloud (builds
      # these URLs), SahajAtlasWeb (parses them), and here (serves them). A stale copy is worse than
      # no copy. The suite keeps passing while the contract drifts from the system it describes.
      #
      # ⚠ TRAP: this job once read the file through `gh api` with a `SAHAJCLOUD_READ_TOKEN` secret.
      # If the secret was missing, the job warned and passed anyway. That design assumed SahajCloud
      # is private. SahajCloud is public. Nobody ever added the secret, so every run took the warn
      # branch and never compared the files. The check stayed green for months without diffing
      # anything. A green check on this job does not by itself prove the diff ran — confirm the
      # "Compare with SahajCloud" step below actually executed the diff.
      #
      # This step uses no token, on purpose: it fetches the same public raw URL that
      # `pnpm sync:atlas-contract` uses in SahajAtlasWeb. If SahajCloud ever goes private, this step
      # fails loudly. That failure is the correct way to find out.
      - name: Compare with SahajCloud
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/sydevs/SahajCloud/main/src/lib/atlas/atlas-url-contract.json \
            -o /tmp/upstream.json
          diff -u /tmp/upstream.json tests/atlas-url-contract.json \
            || { echo "::error::tests/atlas-url-contract.json has drifted from SahajCloud. Copy the upstream file over it and re-check the specs in tests/contract.php."; exit 1; }

  # Dependency-vulnerability gate. Fails only when this PR ADDS a dependency
  # with a high or critical advisory that reaches production code. An
  # advisory against a dependency already on main fails nothing here: the
  # sydevs loop's daily Dependabot check fixes those, so an unrelated PR is
  # never blocked by something it did not cause. Shared by the sydevs repos;
  # the rules live in
  # sydevs/claude-workflow/.github/workflows/dependency-review.yml.
  dependencies:
    name: Dependency Review
    uses: sydevs/claude-workflow/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
