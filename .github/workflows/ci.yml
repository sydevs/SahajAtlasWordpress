name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both run PHP in WebAssembly via @wp-playground/cli — no system PHP, no Docker, and the
      # same versions a client site runs: the fleet's floor is WordPress 6.7 on PHP 7.4.
      - name: Syntax check
        run: pnpm lint

      - name: Integration tests (WordPress 6.7, PHP 7.4)
        run: pnpm test

      # Boots a real server per theme kind. The plugin takes a genuinely different code path for
      # each — `register_block_template()` vs `template_include` — so one of them passing says
      # nothing about the other.
      - name: Render checks (block and classic themes)
        run: pnpm test:render

  contract:
    name: URL contract in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `atlas-url-contract.json` is byte-identical in SahajCloud (which builds these URLs),
      # SahajAtlasWeb (which parses them) and here (which serves them). A copy that drifts is worse
      # than no copy: the suite keeps passing against a contract the rest of the system has moved
      # on from.
      #
      # ⚠ **No token, and no skip branch.** An earlier version of this job read the file through
      # `gh api` with a `SAHAJCLOUD_READ_TOKEN` secret, and warned-and-passed when the secret was
      # absent — on the stated premise that SahajCloud is private. **It is public.** That premise
      # was written without checking, and it cost the check its teeth: the secret was never added,
      # so every run took the warn branch and the contract was never actually compared. A gate that
      # cannot run is worth less than one that does not exist, because it reads green.
      #
      # The raw URL is the same one `pnpm sync:atlas-contract` uses in SahajAtlasWeb, unauthenticated
      # there too. If SahajCloud ever does go private this step fails loudly, which is the correct
      # way to find out.
      - name: Compare with SahajCloud
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/sydevs/SahajCloud/main/src/lib/atlas/atlas-url-contract.json \
            -o /tmp/upstream.json
          diff -u /tmp/upstream.json tests/atlas-url-contract.json \
            || { echo "::error::tests/atlas-url-contract.json has drifted from SahajCloud. Copy the upstream file over it and re-check the specs in tests/contract.php."; exit 1; }
