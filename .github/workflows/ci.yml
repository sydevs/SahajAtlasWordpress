name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both steps run PHP in WebAssembly through @wp-playground/cli. This needs no system PHP or
      # Docker. It also matches the oldest client versions: WordPress 6.7 and PHP 7.4.
      - name: Syntax check
        run: pnpm lint

      - name: Integration tests (WordPress 6.7, PHP 7.4)
        run: pnpm test

      # This step starts a real server for each theme kind. The plugin uses a different code path
      # for each kind: `register_block_template()` for block themes, `template_include` for classic
      # themes. A pass on one kind does not test the other.
      - name: Render checks (block and classic themes)
        run: pnpm test:render

  contract:
    name: URL contract in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `atlas-url-contract.json` must stay byte-identical across three repos: SahajCloud (builds
      # these URLs), SahajAtlasWeb (parses them), and here (serves them). A stale copy is worse than
      # no copy. The suite keeps passing while the contract drifts from the system it describes.
      #
      # ⚠ TRAP: this job once read the file through `gh api` with a `SAHAJCLOUD_READ_TOKEN` secret.
      # If the secret was missing, the job warned and passed anyway. That design assumed SahajCloud
      # is private. SahajCloud is public. Nobody ever added the secret, so every run took the warn
      # branch and never compared the files. The check stayed green for months without diffing
      # anything. A green check on this job does not by itself prove the diff ran — confirm the
      # "Compare with SahajCloud" step below actually executed the diff.
      #
      # This step uses no token, on purpose: it fetches the same public raw URL that
      # `pnpm sync:atlas-contract` uses in SahajAtlasWeb. If SahajCloud ever goes private, this step
      # fails loudly. That failure is the correct way to find out.
      - name: Compare with SahajCloud
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/sydevs/SahajCloud/main/src/lib/atlas/atlas-url-contract.json \
            -o /tmp/upstream.json
          diff -u /tmp/upstream.json tests/atlas-url-contract.json \
            || { echo "::error::tests/atlas-url-contract.json has drifted from SahajCloud. Copy the upstream file over it and re-check the specs in tests/contract.php."; exit 1; }
