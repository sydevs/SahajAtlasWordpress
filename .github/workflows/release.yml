name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠ This workflow exists for one reason: the zip's top folder must be named `sahaj-atlas`.
      # GitHub's own "Source code (zip)" names that folder `SahajAtlasWordpress-<tag>` instead.
      # WordPress installs an update into the folder the zip names. A wrong folder name installs a
      # second, separate plugin next to the first. Both copies then run. Each one refuses the
      # other's `<sahaj-atlas>` element.
      #
      # The slug must match `SAHAJ_ATLAS_SLUG` in `includes/updates.php`. Never let the two values
      # diverge.
      - name: Build the plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -n 's/^ \* Version: *//p' sahaj-atlas.php | head -1 | tr -d '[:space:]')
          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the plugin header version ($HEADER)."
            exit 1
          fi
          mkdir -p build/sahaj-atlas
          rsync -a --exclude-from=.distignore ./ build/sahaj-atlas/
          cd build && zip -qr "../sahaj-atlas-${VERSION}.zip" sahaj-atlas

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See readme.txt for the changelog." \
            --verify-tag \
            "sahaj-atlas-${GITHUB_REF_NAME#v}.zip" \
            || gh release upload "$GITHUB_REF_NAME" "sahaj-atlas-${GITHUB_REF_NAME#v}.zip" --clobber
