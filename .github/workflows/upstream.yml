name: Upstream drift

# ⚠ CI's "Tests (current PHP and WordPress)" job pins its WordPress version, so a core release can
# never turn an unrelated pull request red. This runs the same two lanes against `latest` instead,
# on a schedule: a red run here says core moved under the plugin, and it blocks no one while that
# is fixed. The fleet's sites take core updates automatically, so the gap between a release and the
# next pin bump is the window this watches.
#
# Never a required check, and never triggered by a pull request. Fixing a failure means making the
# plugin work on the new core, then raising `SAHAJ_ATLAS_WP` in ci.yml to that version.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  latest:
    name: Tests (PHP 8.3, WordPress latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAHAJ_ATLAS_PHP: '8.3'
      SAHAJ_ATLAS_WP: latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both lanes print the runtime they booted, so the log names the version that broke.
      - name: Integration tests
        run: pnpm test

      - name: Render checks (block and classic themes)
        run: pnpm test:render
