# This workflow updates Stage, assignees, and the `awaiting` label from GitHub events. It also
# adds new items to the org workflow board. All rules live in one reusable workflow. This keeps
# the five repos in sync:
# https://github.com/sydevs/claude-workflow/blob/main/.github/workflows/state-machine.yml
name: Workflow state

on:
  issues:
    types: [opened, reopened, transferred, closed, assigned, field_added, field_removed]
  issue_comment:
    types: [created]
  # This trigger is pull_request_target, not pull_request. The job needs the org secret. Checking
  # out no code here is what makes this trigger safe.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  state:
    uses: sydevs/claude-workflow/.github/workflows/state-machine.yml@main
    secrets:
      token: ${{ secrets.ADD_TO_PROJECT_PAT }}
